<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GeeYami App 安装中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      font-size: 16px;
      color: #666;
    }

    .app-link {
      display: inline-block;
      margin: 15px 0;
      padding: 12px 25px;
      font-size: 16px;
      color: #fff;
      background-color: #007aff;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .app-link:hover {
      background-color: #005fcc;
    }

    .label {
      font-size: 14px;
      color: #888;
      margin-top: 5px;
    }

    .block {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <h1>GeeYami App 安装中心</h1>
  <p>点击下方按钮安装不同模块的 App（仅支持 iOS）</p>

  <div class="block">
    <a class="app-link" href="itms-services://?action=download-manifest&url=https://70nyc.com/geeyami/call/manifest.plist">
      安装 GeeCallIn 厨房沟通 App
    </a>
    <div class="label">Network Calling App</div>
  </div>

  <div class="block">
    <a class="app-link" href="itms-services://?action=download-manifest&url=https://70nyc.com/geeyami/server/manifest.plist">
      安装 商家订单管理 App
    </a>
    <div class="label">Business Order App</div>
  </div>

  <div class="block">
    <a class="app-link" href="itms-services://?action=download-manifest&url=https://70nyc.com/geeyami/vendor/manifest.plist">
      安装 Vendor 商户版 App
    </a>
    <div class="label">Vendor App</div>
  </div>

  <div class="block">
    <a class="app-link" href="itms-services://?action=download-manifest&url=https://70nyc.com/geeyami/order/manifest.plist">
      安装 GeeYami 叫货 App
    </a>
    <div class="label">Supply Ordering App</div>
  </div>

</body>
</html>
